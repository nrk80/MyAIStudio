name: Build My AI Studio APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract Android project only
        run: |
          mkdir -p source
          unzip -oq MyAIStudio_Android_v1_phone_build.zip -d source
          test -f source/MyAIStudio_Android_v1/settings.gradle.kts
          echo "Android project extracted successfully"

      - name: Inspect Android compatibility settings
        run: |
          echo "===== AndroidManifest.xml ====="
          cat source/MyAIStudio_Android_v1/app/src/main/AndroidManifest.xml
          echo "===== app/build.gradle.kts ====="
          cat source/MyAIStudio_Android_v1/app/build.gradle.kts
          echo "===== root build.gradle.kts ====="
          cat source/MyAIStudio_Android_v1/build.gradle.kts

      - name: Build APK
        run: |
          cd source/MyAIStudio_Android_v1
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle.kts
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle.kts
          gradle --no-daemon -Pkotlin.jvm.target.validation.mode=warning :app:assembleDebug

      - name: Verify APK package, SDK levels and signature
        run: |
          APK_PATH="source/MyAIStudio_Android_v1/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "===== APK badging ====="
          "$BUILD_TOOLS/aapt" dump badging "$APK_PATH" | head -25
          echo "===== APK signature verification ====="
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_PATH"
          echo "===== APK native libraries ====="
          unzip -l "$APK_PATH" | grep 'lib/' || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAIStudio-debug-apk
          path: source/MyAIStudio_Android_v1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
