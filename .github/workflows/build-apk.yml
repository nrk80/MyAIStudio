

name: Build My AI Studio APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract Android project
        run: |
          mkdir -p source
          FOUND=0
          for ZIP_FILE in ./*.zip; do
            [ -f "$ZIP_FILE" ] || continue
            echo "Extracting: $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d source
            FOUND=1
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "No ZIP files found"
            ls -la
            exit 1
          fi
          echo "Extracted project files:"
          find source -maxdepth 5 -type f | head -100

      - name: Build APK
        run: |
          PROJECT_FILE="$(find source -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "Android project settings file not found"
            find source -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "Android project: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle.kts
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle.kts

          # Force Java compile tasks to target JVM 17, matching Kotlin.
          printf '\n// Keep Java and Kotlin bytecode targets aligned.\ntasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {\n    sourceCompatibility = "17"\n    targetCompatibility = "17"\n}\n' >> app/build.gradle.kts

          gradle --no-daemon -Pkotlin.jvm.target.validation.mode=warning :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAIStudio-debug-apk
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
